name: CoralNPU CI
on:
  workflow_dispatch:
  pull_request:
  push:
    tags:
      - "*"
    branches:
      - main

jobs:
  build-docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          ssh-key: ${{ secrets.ACTIONS_DEPLOY_KEY }}
      - uses: docker/setup-buildx-action@v3
      - id: id
        run: |
          echo "uid=$(id -u)" >> $GITHUB_OUTPUT
          echo "gid=$(id -g)" >> $GITHUB_OUTPUT
      - name: Build and Cache Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: utils/coralnpu.dockerfile
          push: false
          load: false
          tags: coralnpu:latest
          build-args: |
            _UID=${{ steps.id.outputs.uid }}
            _GID=${{ steps.id.outputs.gid }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  macro-signatures:
    needs: build-docker
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          ssh-key: ${{ secrets.ACTIONS_DEPLOY_KEY }}
      - uses: docker/setup-buildx-action@v3
      - id: id
        run: |
          echo "uid=$(id -u)" >> $GITHUB_OUTPUT
          echo "gid=$(id -g)" >> $GITHUB_OUTPUT
      - name: Load Docker image from cache
        uses: docker/build-push-action@v6
        with:
          context: .
          file: utils/coralnpu.dockerfile
          push: false
          load: true
          tags: coralnpu:latest
          build-args: |
            _UID=${{ steps.id.outputs.uid }}
            _GID=${{ steps.id.outputs.gid }}
          cache-from: type=gha
      - name: Check Macro Signatures in Docker
        run: |
          docker run --rm --init --ipc=host \
            -v ${{ github.workspace }}:${{ github.workspace }} \
            -w ${{ github.workspace }} \
            -v $HOME:/home/runner \
            -v $HOME:/home/builder \
            coralnpu:latest \
            python3 utils/check_macro_signatures.py

  lint:
    needs: build-docker
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.ACTIONS_DEPLOY_KEY }}
      - uses: docker/setup-buildx-action@v3
      - id: id
        run: |
          echo "uid=$(id -u)" >> $GITHUB_OUTPUT
          echo "gid=$(id -g)" >> $GITHUB_OUTPUT
      - name: Load Docker image from cache
        uses: docker/build-push-action@v6
        with:
          context: .
          file: utils/coralnpu.dockerfile
          push: false
          load: true
          tags: coralnpu:latest
          build-args: |
            _UID=${{ steps.id.outputs.uid }}
            _GID=${{ steps.id.outputs.gid }}
          cache-from: type=gha
      - name: Run Linters in Docker
        run: |
          docker run --rm --init --ipc=host \
            -e GITHUB_ACTIONS="${{ env.GITHUB_ACTIONS }}" \
            -e GITHUB_EVENT_NAME="${{ github.event_name }}" \
            -e GITHUB_BASE_REF="${{ github.base_ref }}" \
            -v ${{ github.workspace }}:${{ github.workspace }} \
            -w ${{ github.workspace }} \
            -v $HOME:/home/runner \
            -v $HOME:/home/builder \
            coralnpu:latest \
            utils/run_linters.sh

  bazel-test:
    needs: build-docker
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          ssh-key: ${{ secrets.ACTIONS_DEPLOY_KEY }}
      - uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true
      - uses: docker/setup-buildx-action@v3
      - id: id
        run: |
          echo "uid=$(id -u)" >> $GITHUB_OUTPUT
          echo "gid=$(id -g)" >> $GITHUB_OUTPUT
      - name: Load Docker image from cache
        uses: docker/build-push-action@v6
        with:
          context: .
          file: utils/coralnpu.dockerfile
          push: false
          load: true
          tags: coralnpu:latest
          build-args: |
            _UID=${{ steps.id.outputs.uid }}
            _GID=${{ steps.id.outputs.gid }}
          cache-from: type=gha
      - name: Run Bazel test in Docker
        run: |
          docker run --rm --init --ipc=host \
            -v ${{ github.workspace }}:${{ github.workspace }} \
            -w ${{ github.workspace }} \
            -v $HOME:/home/runner \
            -v $HOME:/home/builder \
            coralnpu:latest \
            bazel test //...
